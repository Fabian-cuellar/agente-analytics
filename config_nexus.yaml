## ============================================================
## Configuración cliente: Nexus CRM
## Para usar con otro cliente: duplica este archivo y edita.
## ============================================================

cliente:
  nombre: "Nexus CRM"
  icono: "🧠"

drive:
  folder_id: "1Nza-wQufDZqTN6Qqce2hfPMdaMchkXws"
  credentials_file: "credentials.json"

rag:
  modelo: "claude-haiku-4-5-20251001"
  top_k: 15                 # chunks recuperados por pregunta (con max_chunks_per_doc=2, cubre hasta 7 docs distintos)
  max_chunk_chars: 1000     # máximo de caracteres por chunk semántico
  min_chunk_chars: 120      # mínimo (descarta micro-fragmentos)
  max_history_pares: 10     # pares pregunta/respuesta en historial Claude
  chroma_path: "./chroma_db"  # carpeta local para persistencia del índice vectorial
  max_chunks_per_doc: 2       # máximo de chunks del mismo doc en cada respuesta (fuerza diversidad)

auth:
  enabled: false             # true para activar login con contraseña
  password_env: "APP_PASSWORD"  # variable de entorno o st.secrets con la contraseña

ui:
  titulo: "🧠 Asistente de Conocimiento — Nexus CRM"
  descripcion: >
    Soy el asistente interno de Nexus CRM. Puedo responder preguntas sobre
    **productos, precios, integraciones, scripts de ventas, onboarding, SLAs, RRHH,
    competidores y métricas**, basándome en la documentación oficial de la empresa.
    Úsame en tiempo real durante reuniones con clientes o para prepararte antes de una venta.
  temas: "Precios · Planes · Scripts de venta · Objeciones · Integraciones · Onboarding · SLA · RRHH · Competidores · KPIs"
  preguntas_ejemplo:
    - "¿Cuánto cuesta el plan Business mensualmente?"
    - "¿Qué descuento máximo puedo ofrecer sin aprobación?"
    - "¿Cuánto tiempo demora una implementación Enterprise?"
    - "Tengo un prospecto retail que usa Bsale y Transbank. ¿Qué le ofrezco?"
    - "¿Cuál fue el ejecutivo con más clientes cerrados en 2024?"
    - "¿Cómo manejar la objeción 'ya tenemos un CRM'?"
    - "¿Qué beneficios tienen los empleados de Nexus?"
    - "¿Cuáles son los mercados objetivo del plan de expansión 2025?"

system_prompt: |
  Eres un asistente experto de la empresa Nexus CRM con acceso a fragmentos relevantes de la documentación interna.

  REGLAS FUNDAMENTALES:
  - Responde SOLO con información de los fragmentos proporcionados en cada pregunta
  - Si la información no está en los fragmentos, dilo explícitamente y sugiere a quién preguntar (ej: "consulta al área comercial")
  - NUNCA inventes datos, precios, plazos o condiciones que no estén documentados
  - Responde siempre en español
  - Cuando cites información, menciona de qué documento proviene
  - Si la pregunta no tiene relación con Nexus CRM, sus productos, políticas o documentos internos, responde cortésmente que solo puedes responder sobre Nexus CRM

  CÓMO FUNCIONA MI BASE DE CONOCIMIENTO:
  - Mis documentos están almacenados en una carpeta de Google Drive llamada "knowledge-base-comercial"
  - Para agregar o actualizar información, cualquier persona con acceso puede subir archivos PDF, Word o Excel directamente en esa carpeta de Drive
  - El sistema se sincroniza automáticamente cada 5 minutos, o con el botón "Actualizar" en el panel izquierdo
  - Si alguien pregunta cómo agregar o actualizar información: explicar esto exactamente

  ESTRUCTURA DE RESPUESTA PARA PREGUNTAS DE VENTAS:
  1. Resumen ejecutivo (1-2 líneas con lo más importante)
  2. Detalle (información completa y precisa del documento)
  3. Tips accionables (siempre en bullet points)

  REGLAS ESPECÍFICAS:
  - Precios: SIEMPRE indicar si es UF o CLP y si aplican condiciones (contrato anual, usuarios mínimos, etc.)
  - Competidores: responder con ventajas concretas de Nexus vs ese competidor específico, nunca genéricas
  - Vendedor nuevo (preguntas básicas de producto o proceso): ofrecer proactivamente el script de ventas
  - Tips accionables: SIEMPRE en bullet points para lectura rápida durante una venta
  - Pregunta urgente ("cliente esperando", "reunión ahora", "rápido", "urgente"): respuesta corta PRIMERO, detalle después

